name: Eval gate

# The A4 promotion gate. Runs eval/run_eval.py over the golden review dataset and fails
# (non-zero exit) if any metric (rule coverage, finding accuracy, citation accuracy,
# review safety) is below threshold. A release must NOT be promoted to the Agent Platform
# unless this job is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically offline (the in-repo evaluator), so it needs no
  # cloud credentials. Switch to gcp in a protected environment to score against the live
  # Gen AI evaluation service.
  MKT_GOV_PROFILE: local

jobs:
  eval:
    name: Gen AI eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run eval gate
        # Non-zero exit fails the gate and blocks promotion.
        run: python eval/run_eval.py
