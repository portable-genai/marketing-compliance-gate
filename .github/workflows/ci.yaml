name: CI

# Lint + format + type-check + tests + eval gate on the LOCAL profile (a WORKING offline
# stack), so CI needs NO Google Cloud credentials and NO google-cloud-* packages. Integration
# tests are deselected. The contract + gcp-import tests additionally prove the onprem
# fail-fast family and the lazy-import GCP family with the SDKs absent.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MKT_GOV_PROFILE: local

jobs:
  gate:
    name: ruff + mypy + pytest + eval (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install (dev only, no GCP SDK)
        # Proves the domain + local profile install and run with no google-cloud-* deps.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: Eval gate (A4 promotion gate)
        # Non-zero exit fails the gate; a release must not be promoted unless this is green.
        run: python eval/run_eval.py

      - name: API import + boot smoke (real app)
        # The run-api target must launch the real FastAPI app. Boot it and hit /healthz.
        run: |
          python -c "from marketing_compliance_gate.api.app import app; assert app.title"
          uvicorn marketing_compliance_gate.api.app:app --host 127.0.0.1 --port 8105 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8105/healthz && break || sleep 1;
          done
          curl -fs http://127.0.0.1:8105/healthz

      - name: Presenter demo self-test (all live steps)
        run: python scripts/demo_selftest.py

  ui-build:
    name: Next.js console builds and hydrates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + type-check + unit-test + build the thin console
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Assert the built console can actually hydrate
        # Starts the BUILT server and reads the served script tags. The CSP header is
        # byte-identical whether the page hydrates or ships as dead markup, so no header
        # assertion, type-check or build result can tell the two apart.
        working-directory: ui
        run: npm run assert-hydratable

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the image
      # install. --no-deps: the locks are fully compiled, so audit those exact versions.
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: npm audit (high severity fails the build)
        working-directory: ui
        run: npm audit --audit-level=high

  terraform-validate:
    name: Terraform format and offline validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.0
      - name: Format and validate without a backend or credentials
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
