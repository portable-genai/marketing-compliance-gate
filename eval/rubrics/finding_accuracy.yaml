# A4 model-risk rubric — finding accuracy (D6).
# The deterministic rule engine must flag exactly the expected failing rules for each
# golden asset (measured as the Jaccard overlap between expected and actual failing rule
# ids). This pins the engine's correctness so a regression is caught at the gate.
metric: finding_accuracy
description: Jaccard overlap of expected vs actual failing rule ids.
threshold: 0.90
companion_metrics:
  citation_accuracy:
    description: Every finding cites a rule in the active rule set (no foreign citations).
    threshold: 1.0
    rationale: >-
      Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case
      over 17 cases, so a single failure gives 0.941, already below 0.99: the bar required 17 of
      17 while reading as though it priced one failure in. 1.0 says the same thing out loud.
      Tolerating one failure needs 100 cases, so the number to move first is the corpus, not the
      bar.
