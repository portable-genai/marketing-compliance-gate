# A4 model-risk rubric — rule coverage (D6).
# Every rule in force for an asset's (market, vertical) must produce a finding (pass or
# fail). Coverage gaps mean a rule was silently skipped, which is unacceptable for a
# compliance gate.
metric: rule_coverage
description: Fraction of applicable rules that produced a finding.
threshold: 1.0
rationale: >-
  Raised from 0.95 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case over
  17 cases, so a single failure gives 0.941, already below 0.95: the bar required 17 of 17 while
  reading as though it priced one failure in. 1.0 says the same thing out loud. Tolerating one
  failure needs 20 cases, so the number to move first is the corpus, not the bar.
companion_metrics:
  review_safety:
    description: Every non-compliant review must require human review (maker-checker).
    threshold: 1.0
    rationale: >-
      Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case
      over 17 cases, so a single failure gives 0.941, already below 0.99: the bar required 17 of
      17 while reading as though it priced one failure in. 1.0 says the same thing out loud.
      Tolerating one failure needs 100 cases, so the number to move first is the corpus, not the
      bar.
